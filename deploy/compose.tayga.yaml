# Layered after the OTel demo compose files. Paths use ${TAYGA_ROOT}
# (exported by the Makefile) because the project directory is the demo.
x-tayga-env: &tayga-env
  RUST_LOG: info
  TAYGA__KAFKA__BROKERS: redpanda:9092
  TAYGA__CLICKHOUSE__URL: http://clickhouse:8123

services:
  tayga-migrate:
    build:
      context: ${TAYGA_ROOT}
      dockerfile: docker/Dockerfile
    image: tayga:dev
    command: ["tayga-writer", "migrate"]
    environment: *tayga-env
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy

  tayga-ingest:
    image: tayga:dev
    container_name: tayga-ingest
    command: ["tayga-ingest"]
    environment: *tayga-env
    ports:
      - "127.0.0.1:14318:4318"
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  tayga-writer:
    image: tayga:dev
    container_name: tayga-writer
    command: ["tayga-writer"]
    environment: *tayga-env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  tayga-assembler:
    image: tayga:dev
    container_name: tayga-assembler
    command: ["tayga-assembler"]
    environment: *tayga-env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  tayga-logminer:
    image: tayga:dev
    container_name: tayga-logminer
    command: ["tayga-logminer"]
    environment: *tayga-env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Serves the web app and /api. Kafka is for consumer-group lag on the
  # pipeline page; deploy/tayga-api.toml lists the in-network /metrics
  # targets its recorder scrapes (a list of tables cannot be set through
  # TAYGA__ env vars). The Jaeger link points at the demo's Jaeger and is
  # always on; the Grafana link is opt-in (`make up-extras` sets it through
  # deploy/compose.extras.yaml).
  tayga-api:
    image: tayga:dev
    container_name: tayga-api
    command: ["tayga-api"]
    environment:
      <<: *tayga-env
      TAYGA__KAFKA__TOPIC: tayga.signals
      TAYGA_CONFIG: /etc/tayga/api.toml
      TAYGA__JAEGER_URL: http://localhost:8080/jaeger/ui
    volumes:
      - ${TAYGA_ROOT}/deploy/tayga-api.toml:/etc/tayga/api.toml:ro
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Opt-in (`make up-extras`): the app's pipeline page replaces them.

  tayga-prometheus:
    image: quay.io/prometheus/prometheus:v3.13.3
    container_name: tayga-prometheus
    profiles: ["extras"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ${TAYGA_ROOT}/deploy/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:19090:9090"
    restart: unless-stopped

  tayga-grafana:
    image: grafana/grafana:13.2.1
    container_name: tayga-grafana
    profiles: ["extras"]
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.22.0
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ${TAYGA_ROOT}/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${TAYGA_ROOT}/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

  otel-collector:
    depends_on:
      tayga-ingest:
        condition: service_started

  flagd:
    volumes:
      - ${TAYGA_ROOT}/deploy/flagd:/etc/flagd
  flagd-ui:
    volumes:
      - ${TAYGA_ROOT}/deploy/flagd:/app/data

  load-generator:
    volumes:
      - ${TAYGA_ROOT}/deploy/locust/tayga_locustfile.py:/usr/src/app/tayga_locustfile.py:ro
    environment:
      - LOCUST_LOCUSTFILE=/usr/src/app/tayga_locustfile.py
    deploy:
      resources:
        limits:
          memory: 2G

  # Demo memory limits raised for Tayga's long-running stack (the vendored demo's defaults are
  # sized for short demos; on 2026-10-05 checkout at 95% of 20M and Kafka near 620M stalled
  # `publish orders` for ~90 s and failed every checkout for six hours).
  checkout:
    deploy:
      resources:
        limits:
          memory: 64M
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 64M
  ad:
    deploy:
      resources:
        limits:
          memory: 512M
  fraud-detection:
    deploy:
      resources:
        limits:
          memory: 512M
  accounting:
    deploy:
      resources:
        limits:
          memory: 320M
  kafka:
    deploy:
      resources:
        limits:
          memory: 1G
  opensearch:
    deploy:
      resources:
        limits:
          memory: 1536M
  grafana:
    deploy:
      resources:
        limits:
          memory: 256M
