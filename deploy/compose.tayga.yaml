# Layered after the OTel demo compose files. Paths use ${TAYGA_ROOT}
# (exported by the Makefile) because the project directory is the demo.
x-tayga-env: &tayga-env
  RUST_LOG: info
  TAYGA__KAFKA__BROKERS: redpanda:9092
  TAYGA__CLICKHOUSE__URL: http://clickhouse:8123

services:
  tayga-migrate:
    build:
      context: ${TAYGA_ROOT}
      dockerfile: docker/Dockerfile
    image: tayga:dev
    command: ["tayga-writer", "migrate"]
    environment: *tayga-env
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy

  tayga-ingest:
    image: tayga:dev
    container_name: tayga-ingest
    command: ["tayga-ingest"]
    environment: *tayga-env
    ports:
      - "127.0.0.1:14318:4318"
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  tayga-writer:
    image: tayga:dev
    container_name: tayga-writer
    command: ["tayga-writer"]
    environment: *tayga-env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  tayga-assembler:
    image: tayga:dev
    container_name: tayga-assembler
    command: ["tayga-assembler"]
    environment: *tayga-env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Consumes tayga.logs (keyed by service) in consumer group tayga-logminer.
  # No container_name, so it can scale: LOGMINER_REPLICAS (default 1) sets the
  # replica count, and each replica mines the services of its partitions.
  # Address it as the compose service (`docker compose ... logs tayga-logminer`);
  # the DNS name tayga-logminer returns every replica, in shuffled order.
  tayga-logminer:
    image: tayga:dev
    command: ["tayga-logminer"]
    environment: *tayga-env
    restart: unless-stopped
    # Shutdown flushes pending work (bounded at 15 s), then runs one new-template pass bounded at 20 s.
    stop_grace_period: 40s
    deploy:
      replicas: ${LOGMINER_REPLICAS:-1}
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Delivers log alerts from tayga.alerts to the webhook and Slack targets in
  # deploy/tayga-notifier.toml (a list of tables, so file config only). With
  # none it idles: it logs "delivery disabled: no targets" and keeps
  # committing offsets. The grace period lets an attempt in flight (timeout
  # at most 15 s) finish and its state be written (up to 20 s more), so a
  # restart never resends it.
  tayga-notifier:
    image: tayga:dev
    container_name: tayga-notifier
    command: ["tayga-notifier"]
    environment:
      <<: *tayga-env
      TAYGA_CONFIG: /etc/tayga/notifier.toml
    volumes:
      - ${TAYGA_ROOT}/deploy/tayga-notifier.toml:/etc/tayga/notifier.toml:ro
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      # The image has no curl: bash opens the metrics port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9100"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Serves the web app and /api. Kafka is for consumer-group lag on the
  # pipeline page; deploy/tayga-api.toml lists the in-network /metrics
  # targets its recorder scrapes (a list of tables cannot be set through
  # TAYGA__ env vars). The Jaeger link points at the demo's Jaeger and is
  # always on; the Grafana link is opt-in (`make up-extras` sets it through
  # deploy/compose.extras.yaml).
  tayga-api:
    image: tayga:dev
    container_name: tayga-api
    command: ["tayga-api"]
    environment:
      <<: *tayga-env
      TAYGA__KAFKA__TOPIC: tayga.signals
      TAYGA_CONFIG: /etc/tayga/api.toml
      TAYGA__JAEGER_URL: http://localhost:8080/jaeger/ui
    volumes:
      - ${TAYGA_ROOT}/deploy/tayga-api.toml:/etc/tayga/api.toml:ro
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    healthcheck:
      # The image has no curl: bash sends GET /healthz (open with auth on) and needs a 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redpanda:
        condition: service_healthy
      tayga-migrate:
        condition: service_completed_successfully

  # Opt-in (`make up-extras`): the app's pipeline page replaces them.

  tayga-prometheus:
    image: quay.io/prometheus/prometheus:v3.13.3
    container_name: tayga-prometheus
    profiles: ["extras"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ${TAYGA_ROOT}/deploy/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:19090:9090"
    restart: unless-stopped

  tayga-grafana:
    image: grafana/grafana:13.2.1
    container_name: tayga-grafana
    profiles: ["extras"]
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.22.0
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ${TAYGA_ROOT}/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${TAYGA_ROOT}/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

  otel-collector:
    depends_on:
      tayga-ingest:
        condition: service_started

  flagd:
    volumes:
      - ${TAYGA_ROOT}/deploy/flagd:/etc/flagd
  flagd-ui:
    volumes:
      - ${TAYGA_ROOT}/deploy/flagd:/app/data

  load-generator:
    volumes:
      - ${TAYGA_ROOT}/deploy/locust/tayga_locustfile.py:/usr/src/app/tayga_locustfile.py:ro
    environment:
      - LOCUST_LOCUSTFILE=/usr/src/app/tayga_locustfile.py
    deploy:
      resources:
        limits:
          memory: 2G

  # Demo memory limits raised for Tayga's long-running stack (the vendored demo's defaults are
  # sized for short demos; on 2026-10-05 checkout at 95% of 20M and Kafka near 620M stalled
  # `publish orders` for ~90 s and failed every checkout for six hours).
  checkout:
    deploy:
      resources:
        limits:
          memory: 64M
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 64M
  ad:
    deploy:
      resources:
        limits:
          memory: 512M
  fraud-detection:
    deploy:
      resources:
        limits:
          memory: 512M
  accounting:
    deploy:
      resources:
        limits:
          memory: 320M
  kafka:
    deploy:
      resources:
        limits:
          memory: 1G
  opensearch:
    deploy:
      resources:
        limits:
          memory: 1536M
  grafana:
    deploy:
      resources:
        limits:
          memory: 256M
