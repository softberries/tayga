global:
  scrape_interval: 15s
scrape_configs:
  - job_name: tayga-ingest
    static_configs: [{ targets: ["tayga-ingest:4318"] }]
  - job_name: tayga-writer
    static_configs: [{ targets: ["tayga-writer:9100"] }]
  - job_name: tayga-assembler
    static_configs: [{ targets: ["tayga-assembler:9100"] }]
  - job_name: tayga-api
    static_configs: [{ targets: ["tayga-api:8090"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
