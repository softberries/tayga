# tayga-notifier settings, mounted at /etc/tayga/notifier.toml (TAYGA_CONFIG).
# TAYGA__NOTIFIER__* env vars override the scalar keys (compose.yaml sets
# public_url from TAYGA_PUBLIC_URL). Targets are a list of tables, so they can
# only be set here. Restart after editing: docker compose restart tayga-notifier
#
# No targets by default: the notifier logs "delivery disabled: no targets" and
# keeps committing tayga.alerts offsets. Webhook URLs are secrets (a Slack
# incoming-webhook URL is a credential): keep this directory private
# (chmod 700). The notifier runs as uid 10001 and must still read this file,
# so do not chmod 600 the file itself.

[notifier]
kinds = ["new", "spike", "silence"]
# Attempts per alert and target; backoff 1 s doubling, capped at 5 min.
max_attempts = 8
# Per request, at most 15.
timeout_secs = 10
# Alerts last updated longer ago than this are skipped.
max_age_secs = 3600
breaker_cooldown_secs = 300

# [[notifier.targets]]
# name = "ops-slack"
# kind = "slack"        # or "webhook"
# url = "https://hooks.slack.com/services/..."
