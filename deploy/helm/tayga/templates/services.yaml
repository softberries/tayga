{{- $fullname := include "tayga.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ingest
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" "ingest") | nindent 4 }}
  {{- with .Values.ingest.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ingest.service.type }}
  selector:
    {{- include "tayga.selectorLabels" (dict "ctx" $ "component" "ingest") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.ingest.service.grpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: {{ .Values.ingest.service.httpPort }}
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "tayga.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
{{- /* Metrics-only Services, scraped by tayga-api's recorder. logminer is
headless so the recorder resolves every replica. */}}
{{- $metrics := list "writer" "assembler" "logminer" }}
{{- if .Values.notifier.enabled }}{{ $metrics = append $metrics "notifier" }}{{ end }}
{{- range $metrics }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ . }}
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" .) | nindent 4 }}
spec:
  {{- if eq . "logminer" }}
  clusterIP: None
  {{- end }}
  selector:
    {{- include "tayga.selectorLabels" (dict "ctx" $ "component" .) | nindent 4 }}
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
{{- end }}
