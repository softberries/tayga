{{- $fullname := include "tayga.fullname" . }}
{{- if and .Values.api.auth.enabled (not .Values.api.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
type: Opaque
stringData:
  TAYGA__AUTH__USERNAME: {{ required "api.auth.username is required when api.auth.enabled is true" .Values.api.auth.username | quote }}
  TAYGA__AUTH__PASSWORD_HASH: {{ required "api.auth.passwordHash is required when api.auth.enabled is true" .Values.api.auth.passwordHash | quote }}
  {{- with .Values.api.auth.sessionKey }}
  TAYGA__AUTH__SESSION_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.notifier.enabled (not .Values.notifier.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-notifier
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" "notifier") | nindent 4 }}
type: Opaque
stringData:
  # tayga-notifier settings (TAYGA_CONFIG). Target URLs are credentials.
  notifier.toml: |
    [notifier]
    public_url = {{ .Values.notifier.publicUrl | toJson }}
    kinds = {{ .Values.notifier.kinds | toJson }}
    {{- range .Values.notifier.targets }}

    [[notifier.targets]]
    name = {{ required "notifier.targets[].name is required" .name | toJson }}
    kind = {{ required "notifier.targets[].kind is required" .kind | toJson }}
    url = {{ required "notifier.targets[].url is required" .url | toJson }}
    {{- end }}
{{- end }}
