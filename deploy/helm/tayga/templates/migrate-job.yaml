{{- /*
The schema migration (tayga-writer migrate).
- External ClickHouse: a pre-install and pre-upgrade hook, so the schema is
  current before any Tayga pod starts.
- Bundled ClickHouse: the database is part of this release and does not exist
  yet when pre-install hooks run, so the Job is a normal resource named per
  revision; the Tayga pods wait in their init container until the schema
  reaches tayga.schemaVersion.
*/ -}}
{{- $fullname := include "tayga.fullname" . }}
{{- $ctx := dict "ctx" $ "component" "migrate" }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.clickhouse.enabled }}
  name: {{ printf "%s-migrate-%d" $fullname .Release.Revision | trunc 63 | trimSuffix "-" }}
  {{- else }}
  name: {{ $fullname }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
  labels:
    {{- include "tayga.labels" $ctx | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tayga.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.clickhouse.enabled }}
      {{- include "tayga.podCommon" . | nindent 6 }}
      initContainers:
        - name: wait-for-clickhouse
          image: {{ include "tayga.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          command:
            - bash
            - -c
            - |
              until (exec 3<>/dev/tcp/{{ include "tayga.clickhouseHost" . }}/8123) 2>/dev/null; do
                echo "waiting for ClickHouse"; sleep 2
              done
      {{- else }}
      {{- /* A hook runs before the release's ServiceAccount exists. */}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "tayga.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tayga-writer", "migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "tayga.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
