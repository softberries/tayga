{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tayga.serviceAccountName" . }}
  labels:
    {{- include "tayga.labels" (dict "ctx" $ "component" "tayga") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Tayga calls no Kubernetes API.
automountServiceAccountToken: false
{{- end }}
