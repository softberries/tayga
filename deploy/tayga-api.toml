# tayga-api settings for compose, loaded through TAYGA_CONFIG. TAYGA__ env
# vars override anything here.
#
# The recorder scrapes these /metrics endpoints every record_secs, by their
# compose service names. tayga-api records its own registry in-process
# (job "tayga-api"), so it is not listed.
# Keep in sync with recorder::default_targets() in crates/tayga-api/src/recorder.rs.

[[metric_targets]]
job = "tayga-ingest"
url = "http://tayga-ingest:4318/metrics"

[[metric_targets]]
job = "tayga-writer"
url = "http://tayga-writer:9100/metrics"

[[metric_targets]]
job = "tayga-assembler"
url = "http://tayga-assembler:9100/metrics"

[[metric_targets]]
job = "tayga-logminer"
url = "http://tayga-logminer:9100/metrics"
