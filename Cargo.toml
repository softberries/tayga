[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["gzip"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic", "trace", "logs", "with-serde"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
clickhouse = { version = "0.15.2", features = ["lz4"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
hex = "0.4.3"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
futures = "0.3.34"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rand = "0.10.3"
argon2 = "0.6.0"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
subtle = "2.6.1"
rpassword = "7.5.4"
regex = "1.13.1"
proptest = "1.11.0"
tayga-api = { path = "crates/tayga-api" }
tayga-common = { path = "crates/tayga-common" }
tayga-model = { path = "crates/tayga-model" }
tayga-analysis = { path = "crates/tayga-analysis" }
tayga-drain = { path = "crates/tayga-drain" }
tayga-kafka = { path = "crates/tayga-kafka" }
tayga-logminer = { path = "crates/tayga-logminer" }
tayga-store = { path = "crates/tayga-store" }
tayga-devtools = { path = "crates/tayga-devtools" }
prometheus-client = "0.25.1"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
