      <g fill="#4A2C1A">
        <circle cx="246" cy="352" r="3"/><circle cx="268" cy="366" r="2.5"/><circle cx="292" cy="356" r="3.5"/>
        <circle cx="316" cy="372" r="2.5"/><circle cx="336" cy="360" r="3"/><circle cx="254" cy="388" r="2.5"/>
        <circle cx="280" cy="398" r="3"/><circle cx="304" cy="390" r="2"/><circle cx="328" cy="402" r="3.5"/>
        <circle cx="352" cy="392" r="2.5"/><circle cx="238" cy="414" r="3"/><circle cx="262" cy="428" r="2.5"/>
        <circle cx="290" cy="424" r="3"/><circle cx="314" cy="436" r="2.5"/><circle cx="340" cy="430" r="3"/>
        <circle cx="358" cy="444" r="2.5"/><circle cx="244" cy="456" r="3.5"/><circle cx="272" cy="462" r="2.5"/>
        <circle cx="298" cy="458" r="3"/><circle cx="324" cy="470" r="3"/><circle cx="348" cy="476" r="2.5"/>
        <circle cx="232" cy="486" r="2.5"/><circle cx="258" cy="494" r="3"/><circle cx="286" cy="490" r="2.5"/>
        <circle cx="310" cy="500" r="3"/><circle cx="338" cy="504" r="2.5"/><circle cx="362" cy="416" r="2"/>
        <ellipse cx="300" cy="412" rx="9" ry="6"/><ellipse cx="332" cy="452" rx="7" ry="5"/><ellipse cx="262" cy="474" rx="8" ry="5"/>
      </g>
      <ellipse cx="262" cy="304" rx="96" ry="26" fill="#1A0F08" opacity="0.38" filter="url(#soft)"/>
      <!-- collar -->
      <path d="M150 292C196 334 276 340 334 312L340 332C278 362 190 356 140 314Z" fill="url(#collar)"/>
      <path d="M152 296C198 336 276 342 334 316" fill="none" stroke="#FFE2A6" stroke-width="3" opacity="0.8"/>
      <path d="M360 330C374 380 380 440 372 512L330 512C350 450 356 390 344 340Z" fill="#B8AD9A" opacity="0.35" filter="url(#soft)"/>
    </g>
    <circle cx="306" cy="348" r="13" fill="#F2B544" stroke="#B9741A" stroke-width="2.5"/>
    <circle cx="302" cy="344" r="4" fill="#FFE9B8"/>

    <!-- lower jaw -->
    <path d="M308 262C338 278 380 280 410 262C404 280 380 290 352 290C328 290 312 282 306 270Z" fill="url(#jaw)"/>

    <!-- skull and cheek -->
