    <g clip-path="url(#skull-clip)">
      <ellipse cx="300" cy="140" rx="60" ry="34" fill="#C58A55" opacity="0.35" filter="url(#softer)"/>
      <ellipse cx="230" cy="290" rx="80" ry="30" fill="#1A0F08" opacity="0.35" filter="url(#softer)"/>
    </g>

    <!-- muzzle -->
