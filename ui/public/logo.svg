    <!-- ear -->
    <use href="#earshape" fill="#120A05" opacity="0.4" transform="translate(10 8)" filter="url(#soft)"/>
    <use href="#earshape" fill="url(#earfill)"/>
    <g clip-path="url(#ear-clip)">
      <ellipse cx="236" cy="170" rx="26" ry="60" fill="#9A6236" opacity="0.4" filter="url(#soft)"/>
      <g fill="none" stroke="#8A5530" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <path d="M176 200C188 218 168 236 182 256"/>
        <path d="M208 190C222 210 200 230 216 252"/>
        <path d="M236 214C246 232 230 248 240 268"/>
        <path d="M166 268C178 286 160 302 172 322"/>
        <path d="M198 274C212 294 190 312 204 334"/>
        <path d="M228 288C238 304 224 320 232 338"/>
