<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tayga">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6CB0"/>
      <stop offset="1" stop-color="#7CC4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.56" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brown" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#8A5530"/>
      <stop offset="0.55" stop-color="#5C3720"/>
      <stop offset="1" stop-color="#3A2012"/>
    </linearGradient>
    <linearGradient id="earfill" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#6A4024"/>
      <stop offset="1" stop-color="#2E180D"/>
    </linearGradient>
    <linearGradient id="white" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6CDBD"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D0C0"/>
      <stop offset="1" stop-color="#F3EEE4"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
