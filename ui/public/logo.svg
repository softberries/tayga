    <path id="muzzle" d="M326 166C350 174 372 184 392 190C414 196 430 206 434 222C437 236 430 248 420 252C412 266 396 274 376 276C350 280 322 276 300 262C288 238 298 192 326 166Z"/>
    <clipPath id="muzzle-clip"><use href="#muzzle"/></clipPath>
    <path id="earshape" d="M222 132C190 128 160 160 150 210C140 260 138 310 152 345C160 364 178 372 190 360C198 372 214 372 222 356C232 364 246 354 246 336C250 290 262 220 258 170C256 148 244 134 222 132Z"/>
