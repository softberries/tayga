      <ellipse cx="366" cy="282" rx="70" ry="16" fill="#8E8271" opacity="0.45" filter="url(#soft)"/>
      <g fill="#4A2C1A">
        <circle cx="338" cy="196" r="2.5"/><circle cx="352" cy="208" r="3"/><circle cx="368" cy="200" r="2"/>
        <circle cx="382" cy="212" r="2.5"/><circle cx="398" cy="206" r="2"/><circle cx="342" cy="224" r="2.5"/>
        <circle cx="360" cy="230" r="3"/><circle cx="378" cy="232" r="2"/><circle cx="394" cy="226" r="2.5"/>
        <circle cx="332" cy="244" r="2"/><circle cx="350" cy="250" r="2.5"/><circle cx="370" cy="252" r="3"/>
        <circle cx="388" cy="248" r="2"/><circle cx="404" cy="242" r="2.5"/><circle cx="326" cy="212" r="2"/>
        <circle cx="344" cy="264" r="2"/><circle cx="364" cy="266" r="2"/><circle cx="410" cy="226" r="2"/>
        <ellipse cx="372" cy="216" rx="6" ry="4"/>
      </g>
    </g>
    <path d="M420 252C390 268 350 270 318 258C312 256 308 250 310 244" fill="none" stroke="#4A2C1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M406 204C412 192 438 194 444 210C448 224 440 236 428 236C414 236 400 220 406 204Z" fill="url(#nose)"/>
    <ellipse cx="422" cy="205" rx="9" ry="4" fill="#FFFFFF" opacity="0.45" transform="rotate(12 422 205)"/>
    <ellipse cx="436" cy="222" rx="3" ry="4.5" fill="#000000" opacity="0.6"/>

    <!-- eye -->
    <g transform="translate(-17 -1)">
    <ellipse cx="300" cy="180" rx="21" ry="23" fill="#2A160B"/>
    <ellipse cx="301" cy="181" rx="18" ry="20" fill="#FBF8F2"/>
    <circle cx="305" cy="183" r="14.5" fill="url(#iris)"/>
    <circle cx="306" cy="184" r="8" fill="#0E0705"/>
    <circle cx="299" cy="175" r="5" fill="#FFFFFF"/>
    <circle cx="312" cy="191" r="2.2" fill="#FFFFFF" opacity="0.85"/>
    <path d="M279 172C284 156 312 152 323 168" fill="none" stroke="#2A160B" stroke-width="5" stroke-linecap="round"/>
    <path d="M278 146C290 134 312 134 326 146" fill="none" stroke="#8A5530" stroke-width="7" stroke-linecap="round"/>
