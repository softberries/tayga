    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>

    <clipPath id="frame"><rect width="512" height="512" rx="150"/></clipPath>
    <path id="body" d="M160 235C125 290 95 380 80 512L372 512C382 450 374 384 348 338C336 316 324 302 312 290Z"/>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <path id="skull" d="M168 236C160 160 210 108 276 110C316 112 340 138 348 168C352 184 350 200 340 214C320 250 290 284 250 292C205 296 172 275 168 236Z"/>
