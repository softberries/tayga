      <stop offset="0.5" stop-color="#2A1812"/>
      <stop offset="1" stop-color="#120906"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC45C"/>
      <stop offset="1" stop-color="#E08A1E"/>
