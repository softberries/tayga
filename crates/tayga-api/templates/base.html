<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tayga{% endblock %}</title>
<style>
:root { --fg:#1d232b; --muted:#68717d; --bg:#fafafa; --card:#fff; --line:#e3e6ea; --err:#c62828; --slow:#b26a00; --crit:#3558d6; }
body { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 0 16px 32px; }
header { display:flex; gap:16px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line); margin-bottom:16px; }
header a { color: var(--fg); text-decoration:none; font-weight:600; }
main { max-width: 1200px; margin: 0 auto; }
table { width:100%; border-collapse:collapse; background:var(--card); }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; }
.badge { display:inline-block; padding:1px 6px; border-radius:4px; color:#fff; font-size:12px; }
.badge.error { background:var(--err); } .badge.slow { background:var(--slow); }
.muted { color:var(--muted); } .mono { font-family: ui-monospace, monospace; font-size:12px; }
.spark { color: var(--err); vertical-align: middle; }
form.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.wf { position:relative; height:18px; background:#f1f3f5; border-radius:3px; }
.wf .bar { position:absolute; top:3px; height:12px; background:#9aa5b1; border-radius:2px; }
.wf .bar.crit { background:var(--crit); } .wf .bar.err { background:var(--err); }
tr.rc td { background:#fdecea; }
.path { font-size:15px; }
.empty { padding:24px; text-align:center; color:var(--muted); background:var(--card); }
</style>
</head>
<body>
<header><a href="/">Tayga</a><a href="/">Story groups</a><a href="/service-map">Service map</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
