<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tayga tour: title</title>
<link rel="stylesheet" href="base.css" />
<style>
	main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
	.logo { width: 196px; height: 196px; border-radius: 44px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 196, 255, 0.18); }
	h1 { margin: 44px 0 0; font-size: 132px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
	.tag { margin: 30px 0 0; font-size: 40px; font-weight: 500; color: var(--ink-2); max-width: 1300px; line-height: 1.35; }
	.sub { margin-top: 56px; display: flex; gap: 18px; }
	.chip { border: 1px solid var(--panel-line); background: rgba(14, 22, 42, 0.8); border-radius: 999px; padding: 12px 24px; font-size: 24px; color: var(--muted); }
	.chip b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<main>
	<img class="logo" src="/logo.svg" alt="" />
	<h1><span class="brand">Tayga</span></h1>
	<p class="tag">Error stories from your OpenTelemetry traces and logs</p>
	<div class="sub">
		<span class="chip"><b>Product tour</b></span>
		<span class="chip">Self-hosted · AGPLv3 core</span>
	</div>
</main>
</body>
</html>
