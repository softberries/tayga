<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tayga tour: end</title>
<link rel="stylesheet" href="base.css" />
<style>
	main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
	.logo { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 196, 255, 0.18); }
	h1 { margin: 34px 0 0; font-size: 76px; font-weight: 700; letter-spacing: -0.02em; }
	.links { margin-top: 56px; display: grid; grid-template-columns: auto auto; gap: 22px 40px; text-align: left; align-items: baseline; }
	.k { font-size: 24px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; text-align: right; }
	.v { font-size: 40px; font-weight: 500; color: var(--ink); }
	.v.primary { color: var(--accent); }
	.foot { margin-top: 64px; font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<div class="grid-bg"></div>
<main>
	<img class="logo" src="/logo.svg" alt="" />
	<h1>Give every failing request a <span class="brand">story</span></h1>
	<div class="links">
		<span class="k">Docs</span><span class="v primary mono">softberries.github.io/tayga</span>
		<span class="k">Code</span><span class="v mono">github.com/softberries/tayga</span>
		<span class="k">Enterprise</span><span class="v mono">hello@softberries.dev</span>
	</div>
	<p class="foot">Tayga by Softberries · open-source core under the AGPLv3</p>
</main>
</body>
</html>
