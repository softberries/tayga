<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tayga tour: poster</title>
<link rel="stylesheet" href="base.css" />
<style>
	/* The title card, opened up in the middle so a play button can sit there without covering the
	   name. With ?play the button and a label are drawn in (for the README, where no player exists). */
	main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 120px 0 128px; }
	.head { display: flex; align-items: center; gap: 40px; }
	.logo { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 196, 255, 0.18); }
	h1 { margin: 0; font-size: 132px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
	.tag { margin: auto 0 0; font-size: 40px; font-weight: 500; color: var(--ink-2); max-width: 1300px; line-height: 1.35; }
	.sub { margin-top: 44px; display: flex; gap: 18px; }
	.chip { border: 1px solid var(--panel-line); background: rgba(14, 22, 42, 0.8); border-radius: 999px; padding: 12px 24px; font-size: 24px; color: var(--muted); }
	.chip b { color: var(--accent); font-weight: 600; }
	.play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; flex-direction: column; align-items: center; gap: 22px; }
	.play i { display: grid; place-items: center; width: 168px; height: 168px; border-radius: 50%; background: linear-gradient(135deg, #3d8bdb, #2b6cb0); box-shadow: 0 0 0 18px rgba(124, 196, 255, 0.12), 0 24px 60px rgba(43, 108, 176, 0.55); }
	.play svg { width: 64px; height: 64px; margin-left: 10px; }
	.play span { font-size: 30px; font-weight: 600; color: var(--ink); }
	body.with-play .play { display: flex; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<main>
	<div class="head">
		<img class="logo" src="/logo.jpg" alt="" />
		<h1><span class="brand">Tayga</span></h1>
	</div>
	<p class="tag">Error stories from your OpenTelemetry traces and logs</p>
	<div class="sub">
		<span class="chip"><b>Product tour</b></span>
		<span class="chip">Self-hosted · AGPLv3 core</span>
	</div>
	<div class="play">
		<i><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z" /></svg></i>
		<span>Watch the narrated tour · 3½ min</span>
	</div>
</main>
<script>
	if (new URLSearchParams(location.search).has('play')) document.body.classList.add('with-play');
</script>
</body>
</html>
